name: Weekly costs run

on:
  schedule:
    # Lunedi' 05:00 UTC ~= 06:00-07:00 ora italiana (l'offset cambia con l'ora legale/solare).
    # Settimanale: restano solo food cost (DDT) e costi delivery (fatture Glovo,
    # che arrivano ogni due settimane), non serve piu' girare ogni giorno.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa Chromium per la generazione PDF del report
        run: playwright install --with-deps chromium

      - name: Scrivi credenziali Google service account
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-key.json

      - name: Ripristina stato sincronizzazione (rileva se i dati sono cambiati)
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Esegui pipeline per tutti i ristoranti
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.pipeline.run_all

      - name: Salva stato sincronizzazione aggiornato
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: sync-state-${{ github.run_id }}

      - name: Carica log e report come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results-${{ github.run_id }}
          path: |
            logs/
            data/*/processed/
          retention-days: 30

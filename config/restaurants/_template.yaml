# Template per onboardare un nuovo ristorante.
# Copia questo file in config/restaurants/<restaurant_id>.yaml e compila i valori.

restaurant_id: "example_id"        # minuscolo, safe da filesystem: usato in data/{id}
display_name: "Example Restaurant"

location:
  city: "City Name"
  address: null                    # opzionale, via e civico
  country_code: "IT"               # ISO 3166-1 alpha-2
  latitude: 45.4642
  longitude: 9.1900
  timezone: "Europe/Rome"          # nome timezone IANA

food_cost:
  ddt_folder_id: null                # ID cartella Drive con le foto DDT (vedi ddt_capture/), null per disattivare
  # La cartella va condivisa (permesso Visualizzatore) con l'email del service account

delivery_costs:
  glovo_folder_id: null              # ID cartella Drive con le fatture Glovo del ristorante (sottocartelle AAAA/MM
                                      # con i PDF fattura), null per disattivare. Stessa condivisione di food_cost.
  report_folder_id: null             # ID della cartella Drive DEDICATA al brand (es. "Report Delivery/FUSHO",
                                      # diversa da quella delle fatture) dove la pipeline carica il PDF dei margini
                                      # delivery, null per disattivare. Dentro crea/aggiorna da sola una sottocartella
                                      # per anno (2026, 2027, ...), un PDF per anno sempre aggiornato con l'ultimo
                                      # dato. Il service account deve avere permesso Editor (non solo Visualizzatore)
                                      # su questa cartella -- condividerla cosi' basta, i permessi si propagano alle
                                      # sottocartelle create in automatico.
